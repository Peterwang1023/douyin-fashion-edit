<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Serif SC";
          font-weight: 500;
          src: url("assets/fonts/serif-500.woff2") format("woff2");
        }
        @font-face {
          font-family: "Noto Serif SC";
          font-weight: 700;
          src: url("assets/fonts/serif-700.woff2") format("woff2");
        }
        @font-face {
          font-family: "Noto Sans SC";
          font-weight: 900;
          src: url("assets/fonts/sans-900.woff2") format("woff2");
        }
        /* Hook: the template's bold yellow outlined caption. Everything after the
           hook uses the wedding-film white serif with a soft shadow, no boxes. */
        #{{OID}}-root {
          --ink: #fffaf3;
          --gold: #f3dfbb;
          --hook: {{HOOK_COLOR}};
          --shade: 22, 20, 20;
          --glow: 0 1px 2px rgba(var(--shade), 0.6), 0 2px 10px rgba(var(--shade), 0.5), 0 0 30px rgba(var(--shade), 0.3);
          position: absolute;
          inset: 0;
          color: var(--ink);
          font-family: "Noto Serif SC", serif;
        }
        #shade {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 700px;
          background: linear-gradient(
            to bottom,
            rgba(var(--shade), 0.4) 0%,
            rgba(var(--shade), 0.32) 30%,
            rgba(var(--shade), 0.16) 60%,
            rgba(var(--shade), 0.05) 82%,
            rgba(var(--shade), 0) 100%
          );
          opacity: 0;
        }
        .layer {
          position: absolute;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
        }
        .block {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .row {
          display: flex;
          align-items: center;
          gap: 22px;
        }
        .hair {
          display: block;
          width: 56px;
          height: 2px;
          background: var(--gold);
          box-shadow: 0 1px 6px rgba(var(--shade), 0.45);
        }

        /* hook */
        #hook {
          top: 170px;
        }
        #hook .block {
          gap: 6px;
        }
        .hook-line {
          font-family: "Noto Sans SC", sans-serif;
          font-weight: 900;
          font-size: 82px;
          line-height: 1.12;
          letter-spacing: 0.02em;
          color: var(--hook);
          -webkit-text-stroke: 12px {{HOOK_STROKE}};
          paint-order: stroke fill;
          text-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
          white-space: nowrap;
        }

        /* brand line */
        #brand {
          top: 200px;
        }
        .brand-text {
          font-weight: 500;
          font-size: 32px;
          letter-spacing: 0.5em;
          padding-left: 0.5em;
          text-shadow: var(--glow);
        }

        /* outfit number + name */
        #labels {
          top: 262px;
        }
        .label {
          position: absolute;
          left: 0;
          right: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          opacity: 0;
        }
        .label-n {
          color: var(--ink);
          font-weight: 700;
          font-size: 40px;
          letter-spacing: 0.3em;
          padding-left: 0.3em;
          text-shadow: var(--glow);
        }
        .label-t {
          font-weight: 700;
          font-size: 52px;
          letter-spacing: 0.1em;
          padding-left: 0.1em;
          text-shadow: var(--glow);
          white-space: nowrap;
        }

        /* closing brand */
        #end {
          top: 250px;
        }
        .e1 {
          font-weight: 700;
          font-size: 100px;
          line-height: 1.15;
          letter-spacing: 0.24em;
          padding-left: 0.24em;
          text-shadow: var(--glow);
        }
        .e-rule {
          display: block;
          width: 180px;
          height: 2px;
          margin: 16px 0 18px;
          background: var(--gold);
          box-shadow: 0 1px 6px rgba(var(--shade), 0.45);
        }
        .e2 {
          font-weight: 500;
          font-size: 36px;
          letter-spacing: 0.2em;
          padding-left: 0.2em;
          text-shadow: var(--glow);
        }

        #brand-line,
        #end-block {
          opacity: 0;
        }
      </style>
      <div id="{{OID}}-root" data-composition-id="{{OID}}" data-width="1080" data-height="1920">
        <div id="shade"></div>

        <div id="hook" class="layer">
          <div class="block">
{{HOOK_LINES}}
          </div>
        </div>

        <div id="brand" class="layer">
          <div id="brand-line" class="row">
            <span class="hair"></span><span class="brand-text">{{BRAND}}</span><span class="hair"></span>
          </div>
        </div>

        <div id="labels" class="layer">
{{LABELS}}
        </div>

        <div id="end" class="layer">
          <div id="end-block" class="block">
            <div id="e1" class="e1">{{BRAND}}</div>
            <span id="e-rule" class="e-rule"></span>
            <div id="e2" class="e2">{{END_LINE}}</div>
          </div>
        </div>
      </div>
      <script>
        const T = {{TIMING}};
        const tl = gsap.timeline({ paused: true });

        // hook: lines punch in on the first frames, gone right before the first whip
        gsap.utils.toArray(".hook-line").forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.2)" }, 0.04 + i * 0.1);
        });
        tl.to(".hook-line", { opacity: 0, duration: 0.18, ease: "power1.in" }, T.hookOut - 0.18);

        // shade: only under the wedding-style captions
        tl.fromTo("#shade", { opacity: 0 }, { opacity: 0.7, duration: 0.4, ease: "sine.out" }, T.hookOut);
        tl.to("#shade", { opacity: 1, duration: 0.5, ease: "sine.inOut" }, T.endIn - 0.4);

        tl.fromTo("#brand-line", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, T.hookOut + 0.1);
        tl.to("#brand-line", { opacity: 0, duration: 0.35, ease: "power1.in" }, T.endIn - 0.3);

        // one label per outfit segment, entering after the whip settles
        T.labels.forEach(([a, b], i) => {
          const el = "#label-" + i;
          tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, a);
          tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.in" }, b - 0.2);
        });

        tl.fromTo("#end-block", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, T.endIn);
        tl.fromTo("#e-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, T.endIn + 0.3);
        tl.fromTo("#e2", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, T.endIn + 0.45);

        window.__timelines["{{OID}}"] = tl;
      </script>
    </template>
  </body>
</html>
